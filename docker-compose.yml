version: "3.8"

services:
  goravel:
    build:
      context: .
    ports:
      - "3000"
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - skynet

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - goravel
    networks:
      - skynet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - skynet

networks:
  skynet:
    external: true

volumes:
  redis_data:
