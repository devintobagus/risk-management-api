name: Deploy to Cloud Run

on:
  push:
    branches:
      - master

env:
  REGION: us-central1
  GAR_REPO: risk-management-api   # your Artifact Registry repo name
  IMAGE_NAME: risk-management-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # ← needed for Workload Identity in this job too

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1087997070820/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@${{ secrets.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1087997070820/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@${{ secrets.PROJECT_ID }}.iam.gserviceaccount.com'

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'risk-management-api'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          region: '${{ env.REGION }}'
          flags: '--allow-unauthenticated --port=3000'
          env_vars: |
            APP_NAME=risk-management-api
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=${{ secrets.APP_URL }}
            APP_HOST=0.0.0.0
            APP_PORT=3000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            LOG_CHANNEL=stack
            LOG_LEVEL=info
            DB_CONNECTION=postgres
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SESSION_DRIVER=file
            SESSION_LIFETIME=120
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            CACHE_STORE=redis
            QUEUE_CONNECTION=redis
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
            YAHOO_API_BASE_URL=${{ secrets.YAHOO_API_BASE_URL }}
            GOOGLE_NEWS_BASE_URL=${{ secrets.GOOGLE_NEWS_BASE_URL }}
            APPSCRIPT_STOCK_LIST_BASE_URL=${{ secrets.APPSCRIPT_STOCK_LIST_BASE_URL }}

      - name: Show deployed URL
        run: echo "${{ steps.deploy.outputs.url }}"